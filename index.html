<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מלאי כספות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADKnPSG7zHuQn5HAu_NteM8lKK1OTZUjM",
            authDomain: "safesmanager.firebaseapp.com",
            projectId: "safesmanager",
            storageBucket: "safesmanager.firebasestorage.app",
            messagingSenderId: "33764610196",
            appId: "1:33764610196:web:7f68e9f0b7c4e3eb62a481"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        signInAnonymously(auth).catch((error) => {
            console.error("Error signing in: ", error);
            alert("שגיאת התחברות ל-Firebase.");
        });

        const form = document.getElementById('addSafeForm');
        const serialInput = document.getElementById('serialNumber');
        const safeTypeInput = document.getElementById('safeType');
        const safeStatusSelect = document.getElementById('safeStatus');
        
        // שדות לקוח ומספר כספת
        const returnDetailsDiv = document.getElementById('returnDetailsDiv');
        const customerNameInput = document.getElementById('customerName');
        const safeNumberInput = document.getElementById('safeNumber');
        
        const hasIturanInput = document.getElementById('hasIturan');
        
        const listContainer = document.getElementById('safesList');
        const totalCount = document.getElementById('totalCount');
        const newCount = document.getElementById('newCount');
        const ituranCount = document.getElementById('ituranCount');
        const returnedCount = document.getElementById('returnedCount');
        const cancelledCount = document.getElementById('cancelledCount');
        
        const scanBtn = document.getElementById('scanBtn');
        const fileInput = document.getElementById('fileInput');

        // הצגה/הסתרה של פרטי ההחזרה בהתאם לסטטוס
        safeStatusSelect.addEventListener('change', (e) => {
            if (e.target.value === 'returned' || e.target.value === 'cancelled') {
                returnDetailsDiv.classList.remove('hidden');
                customerNameInput.required = true;
            } else {
                returnDetailsDiv.classList.add('hidden');
                customerNameInput.required = false;
                customerNameInput.value = '';
                safeNumberInput.value = '';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const serialNumber = serialInput.value.trim();
            const safeType = safeTypeInput.value;
            const originStatus = safeStatusSelect.value;
            const customerName = customerNameInput.value.trim();
            const safeNumber = safeNumberInput.value.trim();
            const hasIturan = hasIturanInput.checked;

            if (!serialNumber || !safeType || !originStatus) {
                alert('נא למלא את כל שדות החובה.');
                return;
            }

            try {
                await addDoc(collection(db, 'safes'), {
                    serialNumber,
                    safeType,
                    originStatus,
                    customerName,
                    safeNumber,
                    hasIturan,
                    timestamp: serverTimestamp()
                });
                form.reset();
                returnDetailsDiv.classList.add('hidden'); // הסתרת השדות בחזרה
            } catch (error) {
                console.error("Error adding doc: ", error);
                alert("שגיאה בהוספת הכספת.");
            }
        });

        const q = query(collection(db, 'safes'), orderBy('timestamp', 'desc'));
        onSnapshot(q, (snapshot) => {
            listContainer.innerHTML = '';
            let total = 0, newSafes = 0, ituran = 0, returned = 0, cancelled = 0;

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                total++;
                
                let actualStatus = data.originStatus;
                if (!actualStatus) {
                    if (data.isNewSafe) actualStatus = 'new';
                    else if (data.returnedFromCustomer) actualStatus = 'returned';
                    else actualStatus = 'unknown';
                }

                if (actualStatus === 'new') newSafes++;
                if (actualStatus === 'returned') returned++;
                if (actualStatus === 'cancelled') cancelled++;
                if (data.hasIturan) ituran++;

                let daysInRoomText = 'נוסף הרגע';
                let dateString = '';
                if (data.timestamp) {
                    const date = data.timestamp.toDate();
                    dateString = date.toLocaleDateString('he-IL');
                    const now = new Date();
                    const dateDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                    const nowDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const diffTime = nowDay - dateDay;
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays === 0) daysInRoomText = 'היום';
                    else if (diffDays === 1) daysInRoomText = 'אתמול';
                    else daysInRoomText = `לפני ${diffDays} ימים`;
                }

                let statusBadge = '';
                if (actualStatus === 'new') statusBadge = '<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded border border-green-200">חדשה</span>';
                if (actualStatus === 'returned') statusBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded border border-yellow-200">סיום פעילות</span>';
                if (actualStatus === 'cancelled') statusBadge = '<span class="bg-orange-100 text-orange-800 text-xs px-2 py-1 rounded border border-orange-200">ביטול התקנה</span>';

                const customerDisplay = data.customerName ? `<p class="text-sm text-gray-700 mt-1">לקוח: <span class="font-bold">${data.customerName}</span></p>` : '';
                const safeNumberDisplay = data.safeNumber ? `<p class="text-sm text-gray-700">מספר כספת: <span class="font-bold text-indigo-700">${data.safeNumber}</span></p>` : '';

                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded shadow-sm border border-gray-200 mb-3 relative overflow-hidden";
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-black text-xl text-gray-800 tracking-wide">${data.serialNumber}</h3>
                            <p class="text-sm text-gray-600 mb-1">סוג: <span class="font-semibold text-blue-700">${data.safeType || 'לא צוין'}</span></p>
                            
                            <div class="bg-slate-50 p-2 rounded mt-2 mb-2 ${!(data.customerName || data.safeNumber) ? 'hidden' : ''}">
                                ${customerDisplay}
                                ${safeNumberDisplay}
                            </div>
                            
                            <div class="flex flex-wrap gap-2 mt-2">
                                ${statusBadge}
                                ${data.hasIturan ? '<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded border border-blue-200">איתוראן</span>' : ''}
                            </div>
                        </div>
                        <button class="text-red-500 hover:text-red-700 delete-btn bg-red-50 p-2 rounded-full transition-colors" data-id="${id}" title="יציאה ללקוח / מחיקה">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                    <div class="mt-3 pt-2 border-t border-gray-100 flex items-center text-xs text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        בחדר: <span class="font-semibold mr-1">${daysInRoomText}</span> ${dateString ? `(${dateString})` : ''}
                    </div>
                `;
                listContainer.appendChild(div);
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm('האם אתה בטוח שברצונך למחוק כספת זו מהמלאי (יציאה ללקוח)?')) {
                        await deleteDoc(doc(db, 'safes', id));
                    }
                });
            });

            totalCount.textContent = total;
            newCount.textContent = newSafes;
            ituranCount.textContent = ituran;
            returnedCount.textContent = returned;
            cancelledCount.textContent = cancelled;
        });

        scanBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            serialInput.value = "סורק תמונה...";
            scanBtn.disabled = true;

            try {
                const result = await Tesseract.recognize(file, 'eng');
                const cleaned = result.data.text.replace(/[^a-zA-Z0-9]/g, '');
                serialInput.value = cleaned;
            } catch (error) {
                console.error(error);
                serialInput.value = "";
                alert("שגיאה בסריקה. נסה שוב.");
            } finally {
                scanBtn.disabled = false;
                fileInput.value = "";
            }
        });
    </script>
</head>
<body class="bg-slate-100 p-3 md:p-6 font-sans">
    <div class="max-w-lg mx-auto">
        <h1 class="text-2xl md:text-3xl font-black text-center mb-6 text-slate-800">מערכת ניהול כספות</h1>

        <!-- סטטיסטיקות מלאי -->
        <div class="flex flex-wrap justify-center gap-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 text-center">
            <div class="px-2 py-1">
                <p class="text-slate-500 text-xs font-bold">סה"כ</p>
                <p class="text-xl font-black text-slate-800" id="totalCount">0</p>
            </div>
            <div class="px-2 py-1">
                <p class="text-slate-500 text-xs font-bold">חדשות</p>
                <p class="text-xl font-black text-green-600" id="newCount">0</p>
            </div>
            <div class="px-2 py-1">
                <p class="text-slate-500 text-xs font-bold">איתוראן</p>
                <p class="text-xl font-black text-blue-600" id="ituranCount">0</p>
            </div>
            <div class="px-2 py-1">
                <p class="text-slate-500 text-xs font-bold">סיום פעילות</p>
                <p class="text-xl font-black text-yellow-600" id="returnedCount">0</p>
            </div>
            <div class="px-2 py-1">
                <p class="text-slate-500 text-xs font-bold">בוטלו</p>
                <p class="text-xl font-black text-orange-600" id="cancelledCount">0</p>
            </div>
        </div>

        <!-- טופס הוספת כספת -->
        <form id="addSafeForm" class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-blue-600 mb-8">
            
            <div class="mb-5 relative">
                <label class="block text-slate-700 text-sm font-bold mb-2">מספר סידורי (מק"ט)</label>
                <div class="flex items-center relative">
                    <input type="text" id="serialNumber" class="bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full py-3 pr-3 pl-12 font-semibold" placeholder="הקלד או צלם ברקוד...">
                    <button type="button" id="scanBtn" class="absolute left-2 top-2 bg-blue-100 p-1.5 rounded-md text-blue-700 hover:bg-blue-200 transition-colors" title="צלם מספר סידורי">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    </button>
                    <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-slate-700 text-sm font-bold mb-2" for="safeType">סוג כספת</label>
                <select id="safeType" class="bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full py-3 px-3 font-semibold" required>
                    <option value="" disabled selected>בחר סוג כספת...</option>
                    <option value="SDM-100">SDM-100</option>
                    <option value="SDM-500">SDM-500</option>
                    <option value="SUMMIT">SUMMIT</option>
                    <option value="CDS">CDS</option>
                    <option value="CD-5">CD-5</option>
                    <option value="CD-7">CD-7</option>
                    <option value="XL">XL</option>
                </select>
            </div>

            <div class="mb-5">
                <label class="block text-slate-700 text-sm font-bold mb-2" for="safeStatus">מצב הכספת / מקור</label>
                <select id="safeStatus" class="bg-slate-50 border border-slate-300 text-slate-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full py-3 px-3 font-semibold" required>
                    <option value="" disabled selected>בחר סטטוס...</option>
                    <option value="new">⭐ כספת חדשה מהניילון</option>
                    <option value="returned">🔄 חזרה מלקוח (סיום פעילות)</option>
                    <option value="cancelled">❌ חזרה עקב ביטול התקנה מצד הלקוח</option>
                </select>
            </div>

            <!-- אזור מוסתר המכיל את פרטי ההחזרה (שם לקוח ומספר כספת) -->
            <div id="returnDetailsDiv" class="mb-5 hidden bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                <div class="mb-3">
                    <label class="block text-slate-800 text-sm font-bold mb-2">שם הלקוח (חובה)</label>
                    <input type="text" id="customerName" class="bg-white border border-slate-300 text-slate-900 rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full py-2.5 px-3 font-semibold placeholder-slate-400" placeholder="מאיזה לקוח הכספת חזרה?">
                </div>
                <div>
                    <label class="block text-slate-800 text-sm font-bold mb-2">מספר כספת (אופציונלי)</label>
                    <input type="text" id="safeNumber" class="bg-white border border-slate-300 text-slate-900 rounded-lg focus:ring-yellow-500 focus:border-yellow-500 block w-full py-2.5 px-3 font-semibold placeholder-slate-400" placeholder="הזן מספר כספת אם קיים">
                </div>
            </div>

            <div class="mb-6 flex items-center bg-slate-50 border border-slate-200 p-4 rounded-lg">
                <input type="checkbox" id="hasIturan" class="w-6 h-6 text-blue-600 bg-white border-slate-300 rounded focus:ring-blue-500 cursor-pointer">
                <label for="hasIturan" class="mr-3 text-slate-800 font-bold cursor-pointer select-none">כולל מערכת איתוראן מותקנת</label>
            </div>

            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-black text-lg py-4 px-4 rounded-xl shadow-lg transition-colors focus:outline-none focus:ring-4 focus:ring-blue-300">
                ➕ הוסף למלאי בחדר
            </button>
        </form>

        <!-- רשימת הכספות -->
        <div>
            <h2 class="text-xl font-black mb-4 text-slate-800 border-b-2 border-slate-200 pb-2 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-2 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                מלאי כספות נוכחי
            </h2>
            <div id="safesList" class="space-y-3">
                <!-- Data will be populated here -->
            </div>
        </div>
    </div>
</body>
</html>
