<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מלאי כספות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <script type="module">
        // ===== הכנס את המפתח שלך כאן =====
        const IMGBB_API_KEY = "6fe106bbbd62e4002350949618b5ab8f";
        // ===================================

        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import {getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, serverTimestamp, query, orderBy} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
        import {getAuth, signInAnonymously} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADKnPSG7zHuQn5HAu_NteM8lKK1OTZUjM",
            authDomain: "safesmanager.firebaseapp.com",
            projectId: "safesmanager",
            storageBucket: "safesmanager.firebasestorage.app",
            messagingSenderId: "33764610196",
            appId: "1:33764610196:web:7f68e9f0b7c4e3eb62a481"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        signInAnonymously(auth).catch((error) => console.error("Error signing in: ", error));
        document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('he-IL');

        // העלאת תמונה
        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error('Image upload failed');
            }
        }

        // תצוגת לילה
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;
        let isDarkMode = false;

        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                htmlElement.classList.add('dark');
                themeToggleBtn.innerHTML = '☀️ מצב יום';
            } else {
                htmlElement.classList.remove('dark');
                themeToggleBtn.innerHTML = '🌙 מצב לילה';
            }
        });

        // --- לוגיקת לשוניות (ניווט) ---
        const tabAddSafe = document.getElementById('tabAddSafe');
        const tabInventory = document.getElementById('tabInventory');
        const addSafeView = document.getElementById('addSafeView');
        const inventoryView = document.getElementById('inventoryView');

        tabAddSafe.addEventListener('click', () => {
            addSafeView.classList.remove('hidden');
            inventoryView.classList.add('hidden');

            tabAddSafe.classList.replace('bg-slate-200', 'bg-blue-700');
            tabAddSafe.classList.replace('text-slate-700', 'text-white');
            tabAddSafe.classList.replace('dark:bg-slate-800', 'dark:bg-blue-600');
            tabAddSafe.classList.replace('dark:text-slate-300', 'dark:text-white');

            tabInventory.classList.replace('bg-blue-700', 'bg-slate-200');
            tabInventory.classList.replace('text-white', 'text-slate-700');
            tabInventory.classList.replace('dark:bg-blue-600', 'dark:bg-slate-800');
            tabInventory.classList.replace('dark:text-white', 'dark:text-slate-300');
        });

        tabInventory.addEventListener('click', () => {
            inventoryView.classList.remove('hidden');
            addSafeView.classList.add('hidden');

            tabInventory.classList.replace('bg-slate-200', 'bg-blue-700');
            tabInventory.classList.replace('text-slate-700', 'text-white');
            tabInventory.classList.replace('dark:bg-slate-800', 'dark:bg-blue-600');
            tabInventory.classList.replace('dark:text-slate-300', 'dark:text-white');

            tabAddSafe.classList.replace('bg-blue-700', 'bg-slate-200');
            tabAddSafe.classList.replace('text-white', 'text-slate-700');
            tabAddSafe.classList.replace('dark:bg-blue-600', 'dark:bg-slate-800');
            tabAddSafe.classList.replace('dark:text-white', 'dark:text-slate-300');
        });
        // ------------------------------

        const form = document.getElementById('addSafeForm');
        const submitBtn = document.getElementById('submitBtn');
        const serialInput = document.getElementById('serialNumber');
        const safeTypeInput = document.getElementById('safeType');
        const safeStatusSelect = document.getElementById('safeStatus');
        const returnDetailsDiv = document.getElementById('returnDetailsDiv');
        const customerNameInput = document.getElementById('customerName');
        const safeNumberInput = document.getElementById('safeNumber');
        const safeConditionNotesInput = document.getElementById('safeConditionNotes');
        const incomingFileInput = document.getElementById('incomingFileInput');

        const ituranWrapper = document.getElementById('ituranWrapper');
        const hasIturanInput = document.getElementById('hasIturan');
        const allowedIturanTypes = ['SDM-100', 'SDM-500', 'SUMMIT', 'XL'];

        const listContainer = document.getElementById('safesList');
        const totalCount = document.getElementById('totalCount');
        const newCount = document.getElementById('newCount');
        const ituranCount = document.getElementById('ituranCount');
        const returnedCount = document.getElementById('returnedCount');
        const cancelledCount = document.getElementById('cancelledCount');

        const scanBtn = document.getElementById('scanBtn');
        const fileInput = document.getElementById('fileInput');

        const dispatchModal = document.getElementById('dispatchModal');
        const btnTakeOutgoingPhoto = document.getElementById('btnTakeOutgoingPhoto');
        const btnSkipPhoto = document.getElementById('btnSkipPhoto');
        const btnCancelDispatch = document.getElementById('btnCancelDispatch');
        const outgoingFileInput = document.getElementById('outgoingFileInput');
        let currentDispatchId = null;

        const viewArchiveBtn = document.getElementById('viewArchiveBtn');
        const listTitle = document.getElementById('listTitle');
        let showingArchive = false;
        let allSafesData = [];

        viewArchiveBtn.addEventListener('click', () => {
            showingArchive = !showingArchive;
            if (showingArchive) {
                viewArchiveBtn.innerHTML = '🔙 חזור למלאי פעיל';
                viewArchiveBtn.classList.replace('bg-slate-200', 'bg-blue-100');
                viewArchiveBtn.classList.replace('text-slate-700', 'text-blue-800');
                listTitle.innerHTML = '📦 היסטוריית כספות שיצאו (ארכיון)';
            } else {
                viewArchiveBtn.innerHTML = '🗄️ היסטוריית יציאות (ארכיון)';
                viewArchiveBtn.classList.replace('bg-blue-100', 'bg-slate-200');
                viewArchiveBtn.classList.replace('text-blue-800', 'text-slate-700');
                listTitle.innerHTML = 'מלאי כספות נוכחי';
            }
            renderSafes();
        });

        safeStatusSelect.addEventListener('change', (e) => {
            if (e.target.value === 'returned' || e.target.value === 'cancelled') {
                returnDetailsDiv.classList.remove('hidden');
                customerNameInput.required = true;
            } else {
                returnDetailsDiv.classList.add('hidden');
                customerNameInput.required = false;
                customerNameInput.value = '';
                safeNumberInput.value = '';
                safeConditionNotesInput.value = '';
                incomingFileInput.value = '';
            }
        });

        safeTypeInput.addEventListener('change', (e) => {
            if (allowedIturanTypes.includes(e.target.value)) {
                ituranWrapper.style.display = 'flex';
            } else {
                ituranWrapper.style.display = 'none';
                hasIturanInput.checked = false;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const serialNumber = serialInput.value.trim();
            const safeType = safeTypeInput.value;
            const originStatus = safeStatusSelect.value;
            const customerName = customerNameInput.value.trim();
            const safeNumber = safeNumberInput.value.trim();
            const safeConditionNotes = safeConditionNotesInput.value.trim();
            const hasIturan = hasIturanInput.checked;

            if (!serialNumber || !safeType || !originStatus) {
                alert('נא למלא את כל שדות החובה.');
                return;
            }

            let incomingImageUrl = null;
            if (incomingFileInput.files.length > 0) {
                if (IMGBB_API_KEY === "הכנס_כאן_את_המפתח_שלך_מ_IMGBB") {
                    alert("שגיאה: טרם הזנת את מפתח ה-API של ImgBB בקוד.");
                    return;
                }
                submitBtn.disabled = true;
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '⏳ מעלה תמונה למערכת...';

                try {
                    incomingImageUrl = await uploadToImgBB(incomingFileInput.files[0]);
                } catch (error) {
                    alert('שגיאה בהעלאת התמונה.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    return;
                }
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }

            try {
                await addDoc(collection(db, 'safes'), {
                    serialNumber,
                    safeType,
                    originStatus,
                    customerName,
                    safeNumber,
                    safeConditionNotes,
                    hasIturan,
                    hasKnockLock: false, // כברירת מחדל עדיין לא הותקן מנעול נקישות
                    incomingImageUrl,
                    isArchived: false,
                    timestamp: serverTimestamp()
                });

                alert("✅ הכספת נוספה בהצלחה!");
                form.reset();
                returnDetailsDiv.classList.add('hidden');
                ituranWrapper.style.display = 'none';
            } catch (error) {
                console.error("Error adding doc: ", error);
                alert("שגיאה בהוספת הכספת.");
            }
        });

        const renderSafes = () => {
            listContainer.innerHTML = '';

            const filteredSafes = allSafesData.filter(safe => {
                if (showingArchive) return safe.data.isArchived === true;
                return !safe.data.isArchived;
            });

            if (filteredSafes.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-500 dark:text-slate-400 mt-8">אין כספות להצגה בתצוגה זו.</p>`;
                return;
            }

            filteredSafes.forEach((safe) => {
                const {id, data} = safe;
                let actualStatus = data.originStatus || (data.isNewSafe ? 'new' : (data.returnedFromCustomer ? 'returned' : 'unknown'));

                let daysInRoomText = 'נוסף הרגע';
                let dateString = '';
                if (data.timestamp) {
                    const date = data.timestamp.toDate();
                    dateString = date.toLocaleDateString('he-IL');

                    if (data.isArchived && data.dispatchedAt) {
                        const dispatchDate = data.dispatchedAt.toDate();
                        daysInRoomText = `יצאה ב: ${dispatchDate.toLocaleDateString('he-IL')} ${dispatchDate.toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit'})}`;
                    } else {
                        const now = new Date();
                        const dateDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                        const nowDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                        const diffDays = Math.floor((nowDay - dateDay) / (1000 * 60 * 60 * 24));

                        if (diffDays === 0) daysInRoomText = 'היום';
                        else if (diffDays === 1) daysInRoomText = 'אתמול';
                        else daysInRoomText = `לפני ${diffDays} ימים`;
                    }
                }

                let statusBadge = '';
                if (actualStatus === 'new') statusBadge = '<span class="bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-100 text-xs px-2 py-1 rounded border border-green-200 dark:border-green-800">חדשה</span>';
                if (actualStatus === 'returned') statusBadge = '<span class="bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-100 text-xs px-2 py-1 rounded border border-yellow-200 dark:border-yellow-800">סיום פעילות</span>';
                if (actualStatus === 'cancelled') statusBadge = '<span class="bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-100 text-xs px-2 py-1 rounded border border-orange-200 dark:border-orange-800">ביטול התקנה</span>';

                const customerDisplay = data.customerName ? `<p class="text-sm text-slate-700 dark:text-slate-300 mt-1">לקוח: <span class="font-bold">${data.customerName}</span></p>` : '';
                const safeNumberDisplay = data.safeNumber ? `<p class="text-sm text-slate-700 dark:text-slate-300">מספר כספת: <span class="font-bold text-indigo-700 dark:text-indigo-400">${data.safeNumber}</span></p>` : '';
                const notesDisplay = data.safeConditionNotes ? `<div class="mt-2 text-sm bg-amber-50 dark:bg-amber-900/30 text-amber-800 dark:text-amber-200 p-2.5 rounded border border-amber-200 dark:border-amber-800 shadow-sm"><span class="font-bold">📝 הערות קליטה:</span> ${data.safeConditionNotes}</div>` : '';

                const incomingPhotoLink = data.incomingImageUrl ? `<a href="${data.incomingImageUrl}" target="_blank" class="text-xs bg-slate-100 dark:bg-slate-700 text-blue-600 dark:text-blue-400 px-2 py-1 rounded-md border border-slate-200 dark:border-slate-600 hover:bg-slate-200 transition-colors">🖼️ כניסה</a>` : '';
                const outgoingPhotoLink = data.outgoingImageUrl ? `<a href="${data.outgoingImageUrl}" target="_blank" class="text-xs bg-slate-100 dark:bg-slate-700 text-blue-600 dark:text-blue-400 px-2 py-1 rounded-md border border-slate-200 dark:border-slate-600 hover:bg-slate-200 transition-colors">🖼️ יציאה</a>` : '';

                // ממשק מנעול נקישות - מוצג רק לכספות חדשות מסוג SDM-100/500 במלאי הפעיל
                let knockLockUI = '';
                if (!showingArchive && actualStatus === 'new' && (data.safeType === 'SDM-100' || data.safeType === 'SDM-500')) {
                    const isChecked = data.hasKnockLock ? 'checked' : '';
                    knockLockUI = `
                        <div class="mt-3 bg-purple-50 dark:bg-purple-900/20 p-2.5 rounded-lg border border-purple-200 dark:border-purple-800 flex items-center justify-between transition-colors shadow-sm">
                            <label class="text-sm font-bold text-purple-900 dark:text-purple-300 flex items-center cursor-pointer select-none">
                                <input type="checkbox" class="knock-lock-checkbox ml-2 w-5 h-5 text-purple-600 bg-white border-purple-300 rounded focus:ring-purple-500 cursor-pointer" data-id="${id}" ${isChecked}>
                                <span>הותקן מנעול נקישות?</span>
                            </label>
                            ${data.hasKnockLock
                            ? '<span class="text-xs bg-purple-200 text-purple-800 dark:bg-purple-800 dark:text-purple-200 px-2 py-1 rounded font-bold tracking-wide">✓ הותקן</span>'
                            : '<span class="text-xs bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-400 px-2 py-1 rounded">ממתין להתקנה</span>'}
                        </div>
                    `;
                }
                // אם הכספת בארכיון, רק מציגים את הסטטוס בלי יכולת לערוך
                else if (showingArchive && actualStatus === 'new' && (data.safeType === 'SDM-100' || data.safeType === 'SDM-500')) {
                    if (data.hasKnockLock) {
                        knockLockUI = `<div class="mt-2 text-xs text-purple-700 dark:text-purple-400 font-bold flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg> מנעול נקישות הותקן</div>`;
                    }
                }

                const actionButton = showingArchive
                    ? `<button class="text-green-500 hover:text-green-700 restore-btn bg-green-50 dark:bg-green-900 p-2 rounded-full transition-colors" data-id="${id}" title="החזר למלאי הפעיל">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                       </button>`
                    : `<button class="text-red-500 hover:text-red-700 delete-btn bg-red-50 dark:bg-red-900 p-2 rounded-full transition-colors" data-id="${id}" title="הוצא מהמלאי (יציאה ללקוח)">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                       </button>`;

                const div = document.createElement('div');
                div.className = "bg-white dark:bg-slate-800 p-4 rounded shadow-sm border border-slate-200 dark:border-slate-700 mb-3 relative overflow-hidden transition-colors";
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="w-full pr-2">
                            <h3 class="font-black text-xl text-slate-800 dark:text-white tracking-wide">${data.serialNumber}</h3>
                            <p class="text-sm text-slate-600 dark:text-slate-400 mb-1">סוג: <span class="font-semibold text-blue-700 dark:text-blue-400">${data.safeType || 'לא צוין'}</span></p>
                            
                            <div class="bg-slate-50 dark:bg-slate-700 p-2 rounded mt-2 mb-2 ${!(data.customerName || data.safeNumber || incomingPhotoLink || outgoingPhotoLink || data.safeConditionNotes) ? 'hidden' : ''}">
                                ${customerDisplay}
                                ${safeNumberDisplay}
                                ${notesDisplay}
                                <div class="flex gap-2 mt-2">
                                    ${incomingPhotoLink}
                                    ${outgoingPhotoLink}
                                </div>
                            </div>
                            
                            <div class="flex flex-wrap gap-2 mt-2">
                                ${statusBadge}
                                ${data.hasIturan ? '<span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-100 text-xs px-2 py-1 rounded border border-blue-200 dark:border-blue-800">איתוראן</span>' : ''}
                                ${data.isArchived ? '<span class="bg-slate-200 text-slate-800 dark:bg-slate-600 dark:text-slate-200 text-xs px-2 py-1 rounded border border-slate-300 dark:border-slate-500">ארכיון</span>' : ''}
                            </div>
                            
                            ${knockLockUI} <!-- תוספת הממשק למנעול נקישות -->
                        </div>
                        ${actionButton}
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-100 dark:border-slate-700 flex items-center text-xs text-slate-500 dark:text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        ${data.isArchived ? daysInRoomText : `בחדר: <span class="font-semibold mr-1">${daysInRoomText}</span>${dateString ? `(${dateString})` : ''}`}
                    </div>
                `;
                listContainer.appendChild(div);
            });

            // אירועים למנעול נקישות (שומר נתונים מיד בעת הסימון ב-V)
            document.querySelectorAll('.knock-lock-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const isChecked = e.target.checked;
                    try {
                        await updateDoc(doc(db, 'safes', id), {
                            hasKnockLock: isChecked
                        });
                    } catch (error) {
                        console.error("Error updating knock lock: ", error);
                        alert("שגיאה בעדכון מסד הנתונים.");
                        e.target.checked = !isChecked; // ביטול הסימון במקרה של שגיאה
                    }
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentDispatchId = e.currentTarget.getAttribute('data-id');
                    dispatchModal.classList.remove('hidden');
                });
            });

            document.querySelectorAll('.restore-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm('להחזיר כספת זו למלאי הפעיל בחדר? (תמונת היציאה תישמר)')) {
                        await updateDoc(doc(db, 'safes', id), {
                            isArchived: false,
                            dispatchedAt: null
                        });
                    }
                });
            });
        };

        btnCancelDispatch.addEventListener('click', () => {
            dispatchModal.classList.add('hidden');
            currentDispatchId = null;
        });

        btnSkipPhoto.addEventListener('click', async () => {
            if (!currentDispatchId) return;
            btnSkipPhoto.innerHTML = 'מעדכן...';
            await updateDoc(doc(db, 'safes', currentDispatchId), {
                isArchived: true,
                dispatchedAt: serverTimestamp()
            });
            btnSkipPhoto.innerHTML = 'הוצא ללא תמונה';
            dispatchModal.classList.add('hidden');
        });

        btnTakeOutgoingPhoto.addEventListener('click', () => {
            if (IMGBB_API_KEY === "הכנס_כאן_את_המפתח_שלך_מ_IMGBB") {
                alert("שגיאה: טרם הזנת את מפתח ה-API של ImgBB בקוד.");
                return;
            }
            outgoingFileInput.click();
        });

        outgoingFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentDispatchId) return;

            btnTakeOutgoingPhoto.innerHTML = '⏳ מעלה תמונה...';
            btnTakeOutgoingPhoto.disabled = true;
            btnSkipPhoto.disabled = true;

            try {
                const url = await uploadToImgBB(file);
                await updateDoc(doc(db, 'safes', currentDispatchId), {
                    isArchived: true,
                    dispatchedAt: serverTimestamp(),
                    outgoingImageUrl: url
                });
                dispatchModal.classList.add('hidden');
            } catch (error) {
                console.error(error);
                alert("שגיאה בהעלאת תמונת היציאה.");
            } finally {
                btnTakeOutgoingPhoto.innerHTML = '📸 צלם כספת יוצאת';
                btnTakeOutgoingPhoto.disabled = false;
                btnSkipPhoto.disabled = false;
                outgoingFileInput.value = '';
            }
        });

        const q = query(collection(db, 'safes'), orderBy('timestamp', 'desc'));
        onSnapshot(q, (snapshot) => {
            allSafesData = [];
            let total = 0, newSafes = 0, ituran = 0, returned = 0, cancelled = 0;

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                allSafesData.push({id, data});

                if (!data.isArchived) {
                    total++;
                    let actualStatus = data.originStatus || (data.isNewSafe ? 'new' : (data.returnedFromCustomer ? 'returned' : 'unknown'));
                    if (actualStatus === 'new') newSafes++;
                    if (actualStatus === 'returned') returned++;
                    if (actualStatus === 'cancelled') cancelled++;
                    if (data.hasIturan) ituran++;
                }
            });

            totalCount.textContent = total;
            newCount.textContent = newSafes;
            ituranCount.textContent = ituran;
            returnedCount.textContent = returned;
            cancelledCount.textContent = cancelled;

            renderSafes();
        });

        scanBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            serialInput.value = "סורק תמונה...";
            scanBtn.disabled = true;

            try {
                const result = await Tesseract.recognize(file, 'eng');
                const cleaned = result.data.text.replace(/[^a-zA-Z0-9]/g, '');
                serialInput.value = cleaned;
            } catch (error) {
                console.error(error);
                serialInput.value = "";
                alert("שגיאה בסריקה. נסה שוב.");
            } finally {
                scanBtn.disabled = false;
                fileInput.value = "";
            }
        });
    </script>
</head>

                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
